[project]
name = "kav-fastweb"
version = "0.0.1"
description = "Kav-FastwebAgent: a local, fast web agent (Kev decides, code verifies), served over MCP"
requires-python = ">=3.12"
dependencies = [
    "websocket-client>=1.8",
    "httpx>=0.27",
    "mcp>=1.10",
    "anyio>=4.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kfw"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["kfw"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # vendor/ (not in git) has its own tests that exit during collection
